<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Umbrella Admin Panel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="login-screen">
    <div class="login-box">
        <h2><i class="fas fa-umbrella"></i> Panel Admin</h2>
        <p>Masukkan Passkey Anda</p>
        <div class="login-input-group">
            <label>PASSKEY</label>
            <input type="password" id="login-passkey" placeholder="Masukkan passkey..." autocomplete="off" onkeypress="if(event.key==='Enter') doLogin()">
        </div>
        <button class="login-btn" onclick="doLogin()">MASUK</button>
        <div id="login-error" class="login-error"></div>
    </div>
</div>

<!-- MAIN DASHBOARD -->
<div id="dashboard">
    <div class="admin-header">
        <div class="admin-info">
            <span class="admin-name" id="admin-name-display">-</span>
            <span class="admin-role" id="admin-role-display">-</span>
        </div>
        <button class="settings-btn" onclick="openSettingsModal()"><i class="fas fa-cog"></i></button>
    </div>

    <div class="tab-container">
        <div class="tab-swipe-area" id="tab-swipe-area">
            <!-- MAILBOX TAB -->
            <div class="tab-page" data-tab="mailbox">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; flex-wrap:wrap; gap:10px;">
                    <h3 style="margin:0;"><i class="fas fa-envelope"></i> Kotak Surat</h3>
                    <select id="mail-filter" onchange="window.setMailFilter(this.value)" 
                            style="background:var(--bg-solid-form); border:1px solid var(--border-line); border-radius:20px; padding:6px 12px; color:white; font-size:0.7rem;">
                        <option value="ALL">📋 Semua</option>
                        <option value="UNREAD">📬 Belum Dibaca</option>
                        <option value="NEED_ACTION">⚠️ Perlu Tindakan</option>
                        <option value="REQUEST_JOIN">🛡️ Permintaan Bergabung</option>
                        <option value="SARAN">💡 Saran</option>
                        <option value="UMUM">📝 Umum</option>
                    </select>
                </div>
                <div id="mailbox-list" class="card-list">Memuat...</div>
            </div>
            
            <!-- KAS TAB -->
            <div class="tab-page" data-tab="kas">
                <div id="kas-container">
                    <div class="loading-state"><i class="fas fa-spinner fa-spin"></i> Memuat...</div>
                </div>
            </div>
            
            <!-- MANAGE ADMIN TAB -->
            <div class="tab-page" data-tab="manage-admin">
                <h3 style="margin-bottom: 15px;"><i class="fas fa-users-cog"></i> Kelola Admin</h3>
                <div id="admin-list-container">Memuat...</div>
                <div style="margin-top: 20px;">
                    <button class="btn-small" onclick="refreshAdminList()" style="width: 100%;"><i class="fas fa-sync-alt"></i> Refresh</button>
                </div>
            </div>

            <!-- KELOLA KONTEN TAB -->
            <div class="tab-page" data-tab="manage-content">
                <h3><i class="fas fa-edit"></i> Kelola Konten Web</h3>
                <div id="content-editor-container">Memuat...</div>
                <button id="refresh-cache-btn" class="btn-primary" onclick="window.updateAllContent()" style="margin-top: 20px; width: 100%;">
                    <i class="fas fa-sync-alt"></i> PERBARUI KONTEN & CACHE
                </button>
            </div>
            
        </div>
    </div>

    <div class="bottom-nav" id="bottom-nav"></div>
</div>

<!-- FLOATING CHAT WIDGET -->
<div class="floating-chat" id="floating-chat" style="display: none;">
    <div class="chat-float-btn" onclick="window.toggleChatWidget()">
        <i class="fas fa-comments"></i>
    </div>
    <div class="chat-widget" id="chat-widget">
        <div class="chat-header">
            <span><i class="fas fa-comments"></i> Obrolan Admin</span>
            <i class="fas fa-times" onclick="window.toggleChatWidget()" style="cursor: pointer;"></i>
        </div>
        <div class="online-users-list" id="online-users-list" style="display: none;">
            <div id="online-users-container">Memuat...</div>
        </div>
        <div class="chat-logs" id="admin-chat-logs"></div>
        <div class="chat-input-area">
            <input type="text" id="admin-chat-input" placeholder="Ketik pesan..." onkeypress="if(event.key==='Enter') window.adminSendMessage()">
            <button onclick="window.adminSendMessage()"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>
</div>

<div id="modal-overlay" class="modal-overlay"></div>
<div id="toast" class="toast"></div>

<script src="admin.js"></script>
<script src="admin-chat.js"></script>
<script src="admin-mail.js"></script>
<script src="admin-finance.js"></script>
<script src="admin-content.js"></script>
</body>
</html>
