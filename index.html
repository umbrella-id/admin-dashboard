<!-- LOGIN SCREEN -->
<div id="login-screen">
    <div class="login-box">
        <h2><i class="fa-solid fa-users-gear"></i> Panel Admin</h2>
        <p>Masukkan Passkey Anda</p>
        <div class="login-input-group">
            <label>PASSKEY</label>
            <input type="password" id="login-passkey" placeholder="Masukkan passkey..." autocomplete="off" onkeypress="if(event.key==='Enter') doLogin()">
        </div>
        <button class="login-btn" onclick="doLogin()">MASUK</button>
        <div id="login-error" class="login-error"></div>
    </div>
</div>

<!-- MAIN DASHBOARD -->
<div id="dashboard">
    <div class="admin-header">
        <div class="admin-info">
            <span class="admin-name" id="admin-name-display">-</span>
            <span class="admin-role" id="admin-role-display">-</span>
        </div>
        <button class="settings-btn" onclick="openSettingsModal()"><i class="fas fa-cog"></i></button>
    </div>

    <div class="tab-container">
        <div class="tab-swipe-area" id="tab-swipe-area">

            <!-- MEMBER TAB -->
            <div class="tab-page" data-tab="member">
                <div id="member-container">
                    <div class="member-header">
                        <h3><i class="fas fa-users"></i> Member Guild</h3>
                        <div class="member-stats">
                            <div class="member-search">
                                <input type="text" id="member-search-input" placeholder="Cari IGN atau WhatsApp" autocomplete="off">
                            </div>
                            <div class="member-buttons">
                                <button class="btn-small btn-update-xixi" onclick="window.exportMemberList()">
                                    <i class="fa-solid fa-clipboard"></i> Update Xixi
                                </button>
                                <button class="refresh-btn btn-small" onclick="refreshMemberList()">
                                    <i class="fas fa-sync-alt"></i> Refresh
                                </button>
                                <button class="btn-small" onclick="openAddMemberModal()">
                                    <i class="fas fa-plus"></i> Add Member
                                </button>
                            </div>
                        </div>
                    </div>
                    <div id="member-warning" class="member-warning" style="display: none;">
                        ⚠️ Ada <span id="missing-wa-badge">0</span> member yang belum mengisi nomor WhatsApp.
                        <button class="btn-small" onclick="filterMissingWA()">Tampilkan</button>
                    </div>
                    <div id="member-list-container">
                        <div class="loading-state"><i class="fas fa-spinner fa-spin"></i> Memuat data member...</div>
                    </div>
                </div>
            </div>
            
            <!-- MAILBOX TAB -->
            <div class="tab-page" data-tab="mailbox">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; flex-wrap:wrap; gap:10px;">
                    <h3 style="margin:0;"><i class="fas fa-envelope"></i> Kotak Surat <span id="mail-badge" style="display:none; background:var(--color-primary); color:white; font-size:0.65rem; padding:2px 8px; border-radius:10px; margin-left:6px;">0</span></h3>
                    <select id="mail-filter" onchange="window.setMailFilter(this.value)" 
                            style="background:var(--bg-solid-form); border:1px solid var(--border-line); border-radius:20px; padding:6px 12px; color:white; font-size:0.7rem;">
                        <option value="all">📋 Semua</option>
                        <option value="unread">📩 Belum Terbaca</option>
                        <option value="read">📖 Sudah Dibaca</option>
                        <option value="replied">💬 Sudah Dibalas</option>
                        <option value="done">✅ Selesai</option>
                        <option value="sent">📤 Surat Keluar</option>
                    </select>
                </div>
                <div id="mailbox-list" class="card-list">Memuat...</div>
            </div>

            <!-- KAS TAB -->
            <div class="tab-page" data-tab="kas">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; flex-wrap:wrap; gap:10px;">
                    <h3 style="margin:0;"><i class="fas fa-coins"></i> Buku Kas</h3>
                    <button class="refresh-btn btn-small" onclick="window.refreshKas()">
                        <i class="fas fa-sync-alt"></i> Refresh
                    </button>
                </div>
                <div id="kas-container">
                    <div class="loading-state"><i class="fas fa-spinner fa-spin"></i> Memuat data kas...</div>
                </div>
            </div>
            
            <!-- TAB KONTEN — REBUILD -->
            <div class="tab-page" data-tab="manage-content" id="tab-content-page">
                
                <!-- ============ VIEW: HOME ============ -->
                <div id="content-view-home" class="content-view">
                    <div id="publish-status-banner" class="publish-status-banner"></div>
                    
                    <!-- WRAPPER BARU UNTUK SPLIT VIEW -->
                    <div class="home-landscape-wrapper">
                        <div id="content-preview-stage" class="content-preview-stage"></div>
                        <div class="home-menu-side">
                            <div class="content-menu-title">Pilih Kategori:</div>
                            <div id="content-menu-grid" class="content-menu-grid"></div>
                        </div>
                    </div>
                </div>
                
                <!-- ============ VIEW: SUB (dinamis) ============ -->
                <div id="content-view-sub" class="content-view" style="display: none;"></div>
                
            </div>
            
            <!-- ============ MODAL REUSABLE (di luar tab-page) ============ -->
            <div id="content-modal-overlay" class="content-modal-overlay">
                <div class="content-modal-box">
                    <div id="content-modal-body"></div>
                </div>
            </div>
            
        </div>
    </div>

    <div class="bottom-nav" id="bottom-nav"></div>
</div>

<!-- FLOATING CHAT WIDGET -->
<div class="floating-chat" id="floating-chat" style="display: none;">
    <div class="chat-float-btn" onclick="window.toggleChatWidget()">
        <i class="fas fa-comments"></i>
    </div>
    <div class="chat-widget" id="chat-widget">
        <div class="chat-header">
            <span><i class="fas fa-comments"></i> Obrolan Admin</span>
            <i class="fas fa-times" onclick="window.toggleChatWidget()" style="cursor: pointer;"></i>
        </div>
        <div class="online-users-list" id="online-users-list" style="display: none;">
            <div id="online-users-container">Memuat...</div>
        </div>
        <div class="chat-logs" id="admin-chat-logs"></div>
        <div class="chat-input-area">
            <input type="text" id="admin-chat-input" placeholder="Ketik pesan..." onkeypress="if(event.key==='Enter') window.adminSendMessage()">
            <button onclick="window.adminSendMessage()"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>
</div>

<div id="modal-overlay" class="modal-overlay"></div>
<div id="toast" class="toast"></div>

<script>
// Fallback: kalau JS gagal load, paksa tampilkan login setelah 5 detik
setTimeout(function() {
    if (!window.__checkSessionRan) {
        var boot = document.getElementById('boot-loading');
        var login = document.getElementById('login-screen');
        if (boot) boot.classList.add('hidden');
        if (login) login.style.display = 'flex';
    }
}, 5000);
</script>
    
</body>
</html>
